services:
  pies-pear-music:
    build:
      context: .
      dockerfile: Dockerfile
    image: pies-pear-music:latest
    container_name: pies-pear-music
    restart: unless-stopped
    ports:
      - "${PORT:-10025}:10025"
    volumes:
      - "${CONFIG_PATH:-./config}:/config"
      - "${MUSIC_PATH:-./music}:/music"
      - "${STAGING_PATH:-/tmp/pies-staging}:/staging"
    privileged: true
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
    security_opt:
      - seccomp:unconfined
    environment:
      - PIES_CONFIG_PATH=/config/config.yaml
      - PIES_STATE_DIR=/config
      - PIES_MUSIC_DIR=/music
      - PIES_STAGING_DIR=/staging
      - PIES_WEB_DIR=/app/web
      - PORT=10025
      - HOST=0.0.0.0
